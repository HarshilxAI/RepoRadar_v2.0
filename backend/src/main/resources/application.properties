spring.application.name=reporadar-api
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

github.api-url=${GITHUB_API_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.connect-timeout-seconds=${GITHUB_CONNECT_TIMEOUT_SECONDS:8}
github.read-timeout-seconds=${GITHUB_READ_TIMEOUT_SECONDS:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.version=1.0.0

logging.level.com.reporadar=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n

gemma.api.key=${OPENROUTER_API_KEY:}
gemma.api.model=${OPENROUTER_MODEL:nvidia/nemotron-3.5-lightning:free}
gemma.api.base-url=${OPENROUTER_API_BASE_URL:https://openrouter.ai/api/v1}
gemma.connect-timeout-seconds=${OPENROUTER_CONNECT_TIMEOUT_SECONDS:8}
# The JDK HTTP request factory treats this as a per-request deadline and cancels the
# underlying exchange. At most one corrective generation follows malformed output.
gemma.read-timeout-seconds=${OPENROUTER_READ_TIMEOUT_SECONDS:35}
gemma.max-output-tokens=${OPENROUTER_MAX_OUTPUT_TOKENS:1200}
