spring.application.name=reporadar-api
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

github.api-url=${GITHUB_API_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.connect-timeout-seconds=${GITHUB_CONNECT_TIMEOUT_SECONDS:8}
github.read-timeout-seconds=${GITHUB_READ_TIMEOUT_SECONDS:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.version=1.0.0

logging.level.com.reporadar=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n

gemma.api.key=${OPENROUTER_API_KEY:}
gemma.api.model=nvidia/nemotron-3.5-lightning:free
gemma.api.base-url=https://openrouter.ai/api/v1
