services:
  - type: web
    name: reporadar-api
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/reporadar-api-1.0.0.jar
    healthCheckPath: /health
    envVars:
      - key: JAVA_VERSION
        value: 25
      - key: GITHUB_API_URL
        value: https://api.github.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
